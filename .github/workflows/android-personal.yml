name: Build openGym Extended for Android

on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-personal.yml']
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a release draft with the signed APK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: opengym-personal-android
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'qrkks/openGym' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.run_number == 6 && startsWith(github.event.head_commit.message, 'Publish openGym Extended 1.4.5.6')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set the Extended app version
        id: version
        working-directory: frontend
        run: |
          base=$(node -p 'require("./package.json").version')
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Install frontend dependencies and run tests
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Build and check the mobile bundle with bundled exercise media
        working-directory: frontend
        env:
          APP_PERSONAL_REVISION: ${{ github.run_number }}
          VITE_PERSONAL_ANDROID: '1'
        run: npm run build:mobile
      - name: Build the Android release APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon -PpersonalRevision="$GITHUB_RUN_NUMBER" testPersonalDebugUnitTest assemblePersonalRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: personal-unsigned
          path: frontend/android/app/build/outputs/apk/personal/release/app-personal-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-release
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: personal-unsigned
      - name: Sign and verify the APK
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          : "${ANDROID_KEYSTORE_B64:?Configure the Android release keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure the Android release password secret}"
          key=$(mktemp)
          aligned=$(mktemp)
          trap 'rm -f -- "$key" "$aligned"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$key"

          mkdir signed
          file="openGym-Personal-$VERSION.apk"
          "$tools/zipalign" -P 16 -f 4 app-personal-release-unsigned.apk "$aligned"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias opengym-personal \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "signed/$file" "$aligned"
          "$tools/zipalign" -c -P 16 4 "signed/$file"
          "$tools/apksigner" verify --print-certs "signed/$file" |
            grep -Fx 'Signer #1 certificate SHA-256 digest: 8cd52a3614766b3f4989912d67ceb65c6bbe5741d38988b6d5fea7c748a83299'

          badging=$("$tools/aapt2" dump badging "signed/$file")
          code=$((1000000 + GITHUB_RUN_NUMBER))
          grep -F "package: name='io.github.qrkks.opengym' versionCode='$code' versionName='$VERSION'" <<< "$badging"
          grep -F "uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" <<< "$badging"
          (cd signed && sha256sum "$file" > "$file.sha256" && sha256sum --check "$file.sha256")
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: opengym-personal-${{ needs.build.outputs.version }}
          path: signed/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Prepare the GitHub release
    if: inputs.draft_release || github.event_name == 'push'
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: opengym-personal-${{ needs.build.outputs.version }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          file="openGym-Personal-$VERSION.apk"
          sha256sum --check "$file.sha256"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$VERSION" == 1.4.5.6 ]]
            gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$GITHUB_SHA" --jq '.content' |
              base64 --decode |
              awk -v heading="## v$VERSION " 'index($0, heading) == 1 { found=1; next } found && /^## / { found=0 } found { print }' > release-notes.md
            grep -q '^-' release-notes.md
            gh release create "personal-v$VERSION" "$file" "$file.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "openGym Extended $VERSION · 训练、运动与恢复" --notes-file release-notes.md
          else
            gh release create "personal-v$VERSION" "$file" "$file.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest \
              --title "openGym Extended $VERSION" --notes "Signed Android APK for openGym Extended, built from $GITHUB_SHA."
          fi
