name: Build OpenGym Personal for Android

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a release draft with the signed APK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: opengym-personal-android
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'qrkks/openGym' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set the personal app version
        id: version
        working-directory: frontend
        run: |
          base=$(node -p 'require("./package.json").version')
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Install frontend dependencies and run tests
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Build and check the mobile bundle with bundled exercise media
        working-directory: frontend
        env:
          APP_PERSONAL_REVISION: ${{ github.run_number }}
          VITE_PERSONAL_ANDROID: '1'
        run: npm run build:mobile
      - name: Build the Android release APK
        working-directory: frontend/android
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon -PpersonalRevision="$GITHUB_RUN_NUMBER" testPersonalDebugUnitTest assemblePersonalRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: personal-unsigned
          path: frontend/android/app/build/outputs/apk/personal/release/app-personal-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-release
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: personal-unsigned
      - name: Sign and verify the APK
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          tools="$ANDROID_HOME/build-tools/36.0.0"
          : "${ANDROID_KEYSTORE_B64:?Configure the Android release keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure the Android release password secret}"
          key=$(mktemp)
          aligned=$(mktemp)
          trap 'rm -f -- "$key" "$aligned"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$key"

          mkdir signed
          file="openGym-Personal-$VERSION.apk"
          "$tools/zipalign" -P 16 -f 4 app-personal-release-unsigned.apk "$aligned"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias opengym-personal \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "signed/$file" "$aligned"
          "$tools/zipalign" -c -P 16 4 "signed/$file"
          "$tools/apksigner" verify --print-certs "signed/$file" |
            grep -Fx 'Signer #1 certificate SHA-256 digest: 8cd52a3614766b3f4989912d67ceb65c6bbe5741d38988b6d5fea7c748a83299'

          badging=$("$tools/aapt2" dump badging "signed/$file")
          code=$((1000000 + GITHUB_RUN_NUMBER))
          grep -F "package: name='io.github.qrkks.opengym' versionCode='$code' versionName='$VERSION'" <<< "$badging"
          grep -F "uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" <<< "$badging"
          (cd signed && sha256sum "$file" > "$file.sha256" && sha256sum --check "$file.sha256")
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: opengym-personal-${{ needs.build.outputs.version }}
          path: signed/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  draft:
    if: inputs.draft_release
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: opengym-personal-${{ needs.build.outputs.version }}
      - name: Create the GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          file="openGym-Personal-$VERSION.apk"
          sha256sum --check "$file.sha256"
          gh release create "personal-v$VERSION" "$file" "$file.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest \
            --title "OpenGym Personal $VERSION" --notes "Android build of $GITHUB_SHA."
